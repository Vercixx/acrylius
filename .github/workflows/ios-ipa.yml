# Builds an unsigned IPA for SideStore to sign on-device with a free Apple ID.
#
# On demand and on tags only. This repository is public, so the minutes are free
# — but a macOS job is minutes of somebody else's hardware, and a run triggered
# on every push would be asking to be taken for abuse. Batch the work and
# dispatch a stage at a time.
#
# Both the image and the Xcode inside it are pinned rather than `macos-latest`
# and a bare `Xcode.app`, so a toolchain bump is a deliberate choice and not a
# surprise failure. The image carries seven Xcode 26.x versions; naming one is
# what stops a default change from silently recompiling the app with a different
# Swift.
name: ios-ipa

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

env:
  # Outside target/, which Swatinem/rust-cache prunes as its own.
  XCODEGEN_CACHE: ${{ github.workspace }}/.xcodegen

jobs:
  ipa:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode_26.6.app
          xcodebuild -version
          swift --version
          # The iOS 26 SDK is what makes the standard controls adopt Liquid
          # Glass. Say which one built this, so a report about how the app looks
          # can be tied to a toolchain.
          xcodebuild -showsdks | grep -i "iphoneos"

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios
      - uses: Swatinem/rust-cache@v2

      - name: Build the core for arm64 iOS
        run: cargo build --release -p acrylius-ffi --target aarch64-apple-ios

      - name: Generate Swift bindings
        run: |
          mkdir -p ios/Generated
          cargo run -q -p acrylius-ffi --bin uniffi-bindgen -- generate \
            --library target/aarch64-apple-ios/release/libacrylius_ffi.a \
            --language swift --out-dir ios/Generated
          cp target/aarch64-apple-ios/release/libacrylius_ffi.a ios/Generated/
          # Xcode finds a modulemap by name; UniFFI emits `<name>FFI.modulemap`.
          mv ios/Generated/acrylius_ffiFFI.modulemap ios/Generated/module.modulemap
          ls -la ios/Generated

      # Keyed on the pinned commit, so a deliberate XcodeGen bump misses the
      # cache and rebuilds, and nothing else does.
      - name: Cache XcodeGen
        uses: actions/cache@v4
        with:
          # Spelled out rather than ${{ env.XCODEGEN_CACHE }}: it must agree
          # with the env above, and `with:` is the one place a context is worth
          # not relying on.
          path: ${{ github.workspace }}/.xcodegen
          key: xcodegen-${{ runner.os }}-21ac9944b0ab546a07422dbed86f33dd2ebd76f8

      - name: Generate the Xcode project
        run: |
          # The same pinned generator scripts/xcodegen-check.sh validates with.
          # `brew install xcodegen` used to stand here, which is not a version:
          # it is whatever bottle this image happens to carry.
          xcodegen="$(./scripts/xcodegen-bin.sh)"
          "$xcodegen" --version
          cd ios && "$xcodegen" generate

      - name: Show what the project offers
        run: xcodebuild -project ios/Acrylius.xcodeproj -list

      - name: Build
        run: |
          set -o pipefail
          # xcbeautify only prettifies. Piping through it unconditionally means
          # that if it is ever missing from the image, `command not found`
          # becomes the failure and the real compiler output is never shown.
          if command -v xcbeautify >/dev/null; then
            pretty=(xcbeautify)
          else
            pretty=(cat)
          fi
          xcodebuild -project ios/Acrylius.xcodeproj -scheme Acrylius \
            -configuration Release -sdk iphoneos -derivedDataPath build \
            ONLY_ACTIVE_ARCH=NO \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build 2>&1 | tee raw.log | "${pretty[@]}" || {
              echo "--- errors ---"
              grep -nE "error:|no such module|cannot find|does not contain a scheme" raw.log | head -40
              echo "--- tail ---"
              tail -200 raw.log
              exit 1
            }

      - name: Ad-hoc sign
        run: |
          set -euo pipefail
          app="$(ls -d build/Build/Products/Release-iphoneos/*.app | head -n1)"
          # Depth first: nested code, then extensions, then the app. Signing the
          # outside first would be invalidated by everything signed after it.
          #
          # Entitlements are passed explicitly at every level. The build ran
          # with CODE_SIGNING_ALLOWED=NO, so nothing is embedded yet, and a
          # plain `codesign --sign -` would produce a signature with none —
          # which is not a build failure, it is a widget that installs and can
          # never see the app's data.
          find "$app" -depth \( -name "*.framework" -o -name "*.dylib" \) \
            -exec codesign --force --sign - {} \;
          for appex in "$app"/PlugIns/*.appex; do
            [ -e "$appex" ] || continue
            echo "signing $(basename "$appex")"
            codesign --force --sign - \
              --entitlements ios/Acrylius/Widgets/AcryliusWidgets.entitlements "$appex"
          done
          codesign --force --sign - \
            --entitlements ios/Acrylius/Acrylius.entitlements "$app"

      - name: The entitlements must be in the signature
        run: |
          set -euo pipefail
          app="$(ls -d build/Build/Products/Release-iphoneos/*.app | head -n1)"
          group="$(grep -oE 'group\.[a-z.]+' ios/Acrylius/Acrylius.entitlements | head -1)"
          echo "looking for $group"
          # AltStore and SideStore read entitlements out of the code signature
          # with ldid, never from a file beside the IPA. One that is missing
          # here is one the installer will never request, and the failure lands
          # on the phone as a widget that is silently empty forever.
          fail=0
          for bundle in "$app" "$app"/PlugIns/*.appex; do
            [ -e "$bundle" ] || continue
            name="$(basename "$bundle")"
            if codesign -d --entitlements :- "$bundle" 2>/dev/null | grep -q "$group"; then
              echo "  ok   $name"
            else
              echo "  FAIL $name has no $group in its signature"
              codesign -d --entitlements :- "$bundle" 2>&1 | head -20 || true
              fail=1
            fi
          done
          exit $fail

      - name: The widget must actually be in there
        run: |
          set -euo pipefail
          app="$(ls -d build/Build/Products/Release-iphoneos/*.app | head -n1)"
          # An extension that failed to embed is not a build error. It is a
          # widget that never appears in the gallery, with nothing to explain it.
          test -d "$app/PlugIns/AcryliusWidgets.appex" || {
            echo "no widget extension in the app bundle"; ls -R "$app" | head -40; exit 1
          }
          # Both binaries link the same Rust core. If that ever stops being true
          # there are two protocol implementations again, which is the one thing
          # this project exists to prevent.
          for bin in "$app/$(basename "$app" .app)" \
                     "$app/PlugIns/AcryliusWidgets.appex/AcryliusWidgets"; do
            echo "$(basename "$bin"): $(lipo -info "$bin")"
            nm -U "$bin" 2>/dev/null | grep -c uniffi_acrylius_ffi \
              | xargs -I{} echo "  {} uniffi symbols"
          done

      - name: Verify it is a device build
        run: |
          app="$(ls -d build/Build/Products/Release-iphoneos/*.app | head -n1)"
          bin="$app/$(basename "$app" .app)"
          lipo -info "$bin"
          # A simulator slice installs on nothing. Fail loudly rather than
          # shipping an artifact that cannot be sideloaded.
          if lipo -info "$bin" | grep -q x86_64; then
            echo "simulator architecture in a device build"; exit 1
          fi

      - name: Package
        run: |
          app="$(ls -d build/Build/Products/Release-iphoneos/*.app | head -n1)"
          mkdir -p Payload && cp -R "$app" Payload/
          zip -qry acrylius-unsigned.ipa Payload
          ls -la acrylius-unsigned.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: acrylius-unsigned-ipa
          path: acrylius-unsigned.ipa
