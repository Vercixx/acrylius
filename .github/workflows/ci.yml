# The fast loop. Runs on every push, costs nothing, and covers most of the
# project, including the Swift that talks to the core, which compiles and runs
# on Linux. Only SwiftUI and Network.framework need macOS.
name: ci

on:
  push:
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Tests
        run: cargo test --workspace

      # The format crate claims no_std. Build it that way or the claim rots.
      - name: acrylius-proto builds no_std
        run: cargo build -p acrylius-proto --no-default-features

  swift:
    runs-on: ubuntu-latest
    container: swift:6.1
    steps:
      # The Swift image carries a Swift toolchain and very little else. curl,
      # because dtolnay/rust-toolchain fetches rustup with it. build-essential,
      # because rustc drives linking through `cc`, and clang being present is
      # not the same as `cc` existing. Without it every build script fails
      # with "linker `cc` not found".
      - name: Prerequisites the Swift image does not ship
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            curl ca-certificates git build-essential

      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      # Two CoreRuntimes pair, connect and ping over an in-memory transport:
      # the same code the iOS app runs, verified without a Mac.
      - name: Swift host runtime tests
        run: ./scripts/swift-test.sh

  daemon:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      # Two daemons pair over real TCP, open a session, ping, and survive a
      # restart.
      - name: M0 acceptance
        run: |
          cargo build --workspace
          ./scripts/m0-acceptance.sh

      # M1 needs a desktop: a logind session to lock and a compositor to hold a
      # clipboard. A headless runner has neither, so this is a developer check
      # rather than a CI one. The plugin and effector unit tests above cover
      # what can be checked without one.
      - name: M1 acceptance (skipped without a desktop)
        run: |
          if [ -n "${WAYLAND_DISPLAY:-}" ]; then
            ./scripts/m1-acceptance.sh
          else
            echo "no desktop on this runner; run scripts/m1-acceptance.sh locally"
          fi

  hygiene:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # The same rule .githooks/commit-msg enforces locally. It is here as well
      # because hooks live outside version control: a fresh clone has none until
      # somebody runs scripts/install-hooks.sh, and a rule that depends on every
      # contributor remembering is not a rule.
      #
      # Scoped to the commits this push actually introduces. Scanning all of
      # history would mean that one such footer, ever, turns CI red permanently
      # until somebody rewrites published commits.
      - name: No attribution footers in the new commits
        run: |
          base="${{ github.event.pull_request.base.sha || github.event.before }}"
          if [ -z "$base" ] || [ "$base" = "0000000000000000000000000000000000000000" ] \
             || ! git cat-file -e "$base^{commit}" 2>/dev/null; then
            range="HEAD~1..HEAD"
          else
            range="$base..HEAD"
          fi
          echo "checking $range"
          if git log "$range" --format='%H %B' \
               | grep -nE 'Co-[Aa]uthored-[Bb]y:|Generated with|Made with Claude'; then
            echo
            echo "Attribution footers do not belong in this history."
            echo "Reword the commit and force-push, or run scripts/install-hooks.sh"
            echo "to be told before it reaches a push next time."
            exit 1
          fi
          echo "clean"
