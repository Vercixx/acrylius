# Generated into an .xcodeproj by `xcodegen generate`, in CI and never checked
# in. The manifest is the source of truth precisely because there is no Mac
# here: an .xcodeproj is not a file anyone can sensibly edit on Linux, and a
# generated one removes the need to.
name: Acrylius

options:
  bundleIdPrefix: org.acrylius
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  # Every extension is another App ID against a free account's ten per week,
  # and SideStore has been observed silently removing extensions on upgrade.
  # M1 ships none; App Intents live in the app target and need no entitlement.

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    ENABLE_USER_SCRIPT_SANDBOXING: NO
    # No entitlements are required in M1: no App Group (no extensions), and no
    # multicast (the phone dials and never broadcasts). The ad-hoc signing step
    # in CI stays anyway, so it is already correct the day one is added.
    CODE_SIGNING_ALLOWED: NO
    CODE_SIGNING_REQUIRED: NO
    CODE_SIGN_IDENTITY: ""

targets:
  Acrylius:
    type: application
    platform: iOS
    sources:
      - path: Acrylius
      # UniFFI output. Produced by the build, so it is gitignored; the CI step
      # that generates it runs before xcodegen.
      #
      # Only the Swift file is a *source*. The static library is linked via
      # OTHER_LDFLAGS and the search path below. Adding it here too would put
      # it in Link Binary With Libraries as well and link it twice. The header
      # and modulemap are found through SWIFT_INCLUDE_PATHS, not compiled.
      - path: Generated/acrylius_ffi.swift
        optional: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.acrylius.app
        INFOPLIST_FILE: Acrylius/Info.plist
        # The Rust staticlib, plus the C header and modulemap UniFFI emits
        # beside the Swift. No XCFramework: that exists to bundle several
        # platform slices, and device-only arm64 is one.
        LIBRARY_SEARCH_PATHS:
          - $(inherited)
          - $(SRCROOT)/Generated
        SWIFT_INCLUDE_PATHS:
          - $(inherited)
          - $(SRCROOT)/Generated
        OTHER_LDFLAGS:
          - $(inherited)
          - -lacrylius_ffi
        TARGETED_DEVICE_FAMILY: "1,2"

# XcodeGen emits no scheme unless asked, and `xcodebuild -scheme` then fails
# with "does not contain a scheme named ...", which reads like a project
# problem rather than a missing declaration. Declaring it here also means the
# scheme is *shared*, so CI sees it; an Xcode-created one lives in xcuserdata
# and would not be checked in.
schemes:
  Acrylius:
    build:
      targets:
        Acrylius: all
    run:
      config: Debug
    archive:
      config: Release
